<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Any model, any skill, on-device data</title>
  <desc id="desc">Three cards: models, skills, and data. Models are any OpenAI-compatible host; skills are any Markdown procedure; data stays on the phone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#0a1620"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61dafb"/>
      <stop offset="1" stop-color="#2f8fb0"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#1f8f5a"/>
    </linearGradient>
    <linearGradient id="accentC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7b15b"/>
      <stop offset="1" stop-color="#b97b2f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fb4c9" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <circle cx="1450" cy="80" r="240" fill="#61dafb" opacity="0.05"/>
  <circle cx="120" cy="520" r="220" fill="#3ddc84" opacity="0.04"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="65" y="78" fill="#f2f7fb" font-size="38" font-weight="750">One APK. No lock-in.</text>
    <text x="65" y="114" fill="#8298ab" font-size="19">Bring the host you already pay for, the skill you already wrote, and keep the work on the phone.</text>
  </g>

  <g transform="translate(65 158)">
    <rect x="0" y="0" width="470" height="316" rx="26" fill="#0c1821" stroke="#203646"/>
    <rect x="0" y="0" width="470" height="5" rx="2.5" fill="url(#accentA)"/>
    <g transform="translate(30 34)">
      <circle cx="26" cy="26" r="26" fill="#0e2733" stroke="#245166"/>
      <circle cx="17" cy="20" r="4" fill="#61dafb"/>
      <circle cx="35" cy="20" r="4" fill="#61dafb"/>
      <circle cx="26" cy="35" r="4" fill="#61dafb"/>
      <path d="M20 23L32 23M19 24L24 32M33 24L28 32" stroke="#61dafb" stroke-width="1.4" opacity="0.7"/>
      <text x="66" y="22" fill="#61dafb" font-size="13" font-weight="700" letter-spacing="2">MODELS</text>
      <text x="66" y="46" fill="#f2f7fb" font-size="25" font-weight="700">Any host</text>
    </g>
    <g transform="translate(30 132)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <circle cx="7" cy="-6" r="4" fill="#61dafb"/>
      <text x="24" y="0" fill="#c7d8e5" font-size="17">DeepSeek API or Web, Qwen Web</text>
      <circle cx="7" cy="34" r="4" fill="#61dafb"/>
      <text x="24" y="40" fill="#c7d8e5" font-size="17">Any OpenAI-compatible endpoint</text>
      <circle cx="7" cy="74" r="4" fill="#61dafb"/>
      <text x="24" y="80" fill="#c7d8e5" font-size="17">Remote, or a local server without a key</text>
      <circle cx="7" cy="114" r="4" fill="#61dafb"/>
      <text x="24" y="120" fill="#c7d8e5" font-size="17">Switch the model without a reinstall</text>
    </g>
  </g>

  <g transform="translate(565 158)">
    <rect x="0" y="0" width="470" height="316" rx="26" fill="#0c1821" stroke="#203646"/>
    <rect x="0" y="0" width="470" height="5" rx="2.5" fill="url(#accentB)"/>
    <g transform="translate(30 34)">
      <circle cx="26" cy="26" r="26" fill="#0e2a1e" stroke="#256143"/>
      <rect x="16" y="13" width="20" height="26" rx="3" fill="none" stroke="#3ddc84" stroke-width="1.6"/>
      <path d="M21 20H31M21 25H31M21 30H27" stroke="#3ddc84" stroke-width="1.4"/>
      <text x="66" y="22" fill="#3ddc84" font-size="13" font-weight="700" letter-spacing="2">SKILLS</text>
      <text x="66" y="46" fill="#f2f7fb" font-size="25" font-weight="700">Any Markdown</text>
    </g>
    <g transform="translate(30 132)">
      <circle cx="7" cy="-6" r="4" fill="#3ddc84"/>
      <text x="24" y="0" fill="#c7d8e5" font-size="17">37 starters, or a file you import</text>
      <circle cx="7" cy="34" r="4" fill="#3ddc84"/>
      <text x="24" y="40" fill="#c7d8e5" font-size="17">App scope, project scope, catalog</text>
      <circle cx="7" cy="74" r="4" fill="#3ddc84"/>
      <text x="24" y="80" fill="#c7d8e5" font-size="17">A skill is read, not executed on install</text>
      <circle cx="7" cy="114" r="4" fill="#3ddc84"/>
      <text x="24" y="120" fill="#c7d8e5" font-size="17">Scan it, edit it, port it to another agent</text>
    </g>
  </g>

  <g transform="translate(1065 158)">
    <rect x="0" y="0" width="470" height="316" rx="26" fill="#0c1821" stroke="#203646"/>
    <rect x="0" y="0" width="470" height="5" rx="2.5" fill="url(#accentC)"/>
    <g transform="translate(30 34)">
      <circle cx="26" cy="26" r="26" fill="#2a2114" stroke="#66512d"/>
      <path d="M26 11L38 17V27C38 35 32 40 26 43C20 40 14 35 14 27V17L26 11Z" fill="none" stroke="#e7b15b" stroke-width="1.6"/>
      <path d="M20 27L24 31L32 22" fill="none" stroke="#e7b15b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="22" fill="#e7b15b" font-size="13" font-weight="700" letter-spacing="2">DATA</text>
      <text x="66" y="46" fill="#f2f7fb" font-size="25" font-weight="700">On the phone</text>
    </g>
    <g transform="translate(30 132)">
      <circle cx="7" cy="-6" r="4" fill="#e7b15b"/>
      <text x="24" y="0" fill="#c7d8e5" font-size="17">Keys in encrypted preferences</text>
      <circle cx="7" cy="34" r="4" fill="#e7b15b"/>
      <text x="24" y="40" fill="#c7d8e5" font-size="17">Chats and projects stay on the device</text>
      <circle cx="7" cy="74" r="4" fill="#e7b15b"/>
      <text x="24" y="80" fill="#c7d8e5" font-size="17">No analytics, no telemetry</text>
      <circle cx="7" cy="114" r="4" fill="#e7b15b"/>
      <text x="24" y="120" fill="#c7d8e5" font-size="17">No key or personal data in the repo</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="65" y="522" fill="#5f788b" font-size="16">The boundary is the protocol, not the brand: an OpenAI-compatible endpoint is the contract.</text>
    <text x="1535" y="522" text-anchor="end" fill="#3ddc84" font-size="16" font-weight="600">Android 8.0+</text>
  </g>
</svg>

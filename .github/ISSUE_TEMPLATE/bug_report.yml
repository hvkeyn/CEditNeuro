name: Bug report
description: Report a reproducible problem in CEditoNeuro.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, private paths, personal notes, or chat transcripts.
  - type: input
    id: version
    attributes:
      label: CEditoNeuro version
      description: The version and versionCode from Settings, or the release tag.
      placeholder: "0.99.34 (150)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Samsung SM-S942B, Android 16"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...
2. Tap ...
3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets, personal paths, and private content first.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I removed secrets and personal data from this report.
          required: true
